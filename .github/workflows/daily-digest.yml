name: Daily Digest

# 16:00 UTC == 00:00 Asia/Shanghai — summarise the day that just ended.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to hand over to the deploy workflow once the issue is committed.
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: cd backend && pnpm install --no-frozen-lockfile

      - name: Write yesterday's issue
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          DIGEST_TIMEZONE: Asia/Shanghai
          CONTENT_DIR: ${{ github.workspace }}/content
        run: cd backend && pnpm digest

      - name: Commit the new issue
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new issue was produced — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "digest: add issue for $(date -u +%F)"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A push made with the built-in token does not start other workflows, so
      # the deploy is requested explicitly instead of relying on the push event.
      - name: Request deployment
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
